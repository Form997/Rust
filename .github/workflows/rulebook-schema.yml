name: Rulebook schema validation

on:
  pull_request:
    paths:
      - "governance/**"
      - ".github/workflows/rulebook-schema.yml"
  push:
    branches:
      - main
      - "h0-2-*"

permissions:
  contents: read

jobs:
  validate-rulebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check check-jsonschema

      - name: Validate schema meta-structure
        run: check-jsonschema --check-metaschema governance/schemas/al-rulebook-bundle.schema.json

      - name: Validate proposed bundle fixture
        run: check-jsonschema --schemafile governance/schemas/al-rulebook-bundle.schema.json governance/bundles/al-rulebook-0.1.0.proposed.json

      - name: Confirm invalid fixture is rejected
        shell: bash
        run: |
          if check-jsonschema --schemafile governance/schemas/al-rulebook-bundle.schema.json governance/fixtures/invalid-rulebook-missing-required.json; then
            echo "ERROR: invalid fixture unexpectedly passed schema validation."
            exit 1
          else
            echo "Expected rejection confirmed."
          fi
