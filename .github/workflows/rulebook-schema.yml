name: Rulebook schema validation

on:
  pull_request:
    paths:
      - "governance/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rulebook-schema.yml"
  push:
    branches:
      - main
      - "h0-2-*"

permissions:
  contents: read

jobs:
  validate-rulebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check check-jsonschema

      - name: Validate all governance schemas
        shell: bash
        run: |
          set -euo pipefail
          for schema in governance/schemas/*.schema.json; do
            echo "Checking schema: $schema"
            check-jsonschema --check-metaschema "$schema"
          done

      - name: Validate positive fixtures
        shell: bash
        run: |
          set -euo pipefail
          check-jsonschema --schemafile governance/schemas/al-rulebook-bundle.schema.json governance/bundles/al-rulebook-0.1.0.proposed.json
          check-jsonschema --schemafile governance/schemas/metric-card.schema.json governance/fixtures/metric-card.proposed.json
          check-jsonschema --schemafile governance/schemas/source-record.schema.json governance/fixtures/source-record.unverified.json
          check-jsonschema --schemafile governance/schemas/decision-record.schema.json governance/fixtures/decision-record.proposed.json
          check-jsonschema --schemafile governance/schemas/training-run-manifest.schema.json governance/fixtures/training-run-manifest.evaluation-only.json

      - name: Confirm negative fixtures are rejected
        shell: bash
        run: |
          set -euo pipefail
          if check-jsonschema --schemafile governance/schemas/al-rulebook-bundle.schema.json governance/fixtures/invalid-rulebook-missing-required.json; then
            echo "ERROR: invalid Rulebook bundle unexpectedly passed."
            exit 1
          fi
          if check-jsonschema --schemafile governance/schemas/metric-card.schema.json governance/fixtures/invalid-metric-card-approved-without-threshold.json; then
            echo "ERROR: invalid metric card unexpectedly passed."
            exit 1
          fi
          echo "Expected rejection confirmed."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --all-targets

      - name: Smoke-test Rust Rulebook CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -- rulebook validate metric-card governance/fixtures/metric-card.proposed.json
          cargo run --quiet -- rulebook validate source-record governance/fixtures/source-record.unverified.json
          cargo run --quiet -- rulebook validate decision-record governance/fixtures/decision-record.proposed.json
          cargo run --quiet -- rulebook validate training-run-manifest governance/fixtures/training-run-manifest.evaluation-only.json
          if cargo run --quiet -- rulebook validate metric-card governance/fixtures/invalid-metric-card-approved-without-threshold.json; then
            echo "ERROR: Rust validator accepted an invalid metric card."
            exit 1
          fi
